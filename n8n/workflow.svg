<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 250" font-family="Inter, -apple-system, Segoe UI, sans-serif"><rect width="1480" height="250" rx="16" fill="#f2f1eb"/><text x="40" y="48" font-size="20" font-weight="600" fill="#0e022d">n8n workflow: emnify weekly account prioritisation</text><text x="40" y="72" font-size="13" fill="#54566b">Upload the three case files in the n8n form, get one Excel file with each SDR's ranked list back. Same logic as the website.</text><rect x="40" y="95" width="170" height="86" rx="12" fill="#fff" stroke="#e3e1d9"/><text x="54" y="131" font-size="14" font-weight="600" fill="#19191a">Upload the Excel files</text><text x="54" y="153" font-size="12" fill="#8a8b99">Form trigger</text><path d="M214 138 H234" stroke="#a285ef" stroke-width="2.5"/><path d="M230 133 L236 138 L230 143" fill="none" stroke="#a285ef" stroke-width="2.5"/><rect x="240" y="95" width="170" height="86" rx="12" fill="#fff" stroke="#e3e1d9"/><text x="254" y="131" font-size="14" font-weight="600" fill="#19191a">One item per file</text><text x="254" y="153" font-size="12" fill="#8a8b99">Code</text><path d="M414 138 H434" stroke="#a285ef" stroke-width="2.5"/><path d="M430 133 L436 138 L430 143" fill="none" stroke="#a285ef" stroke-width="2.5"/><rect x="440" y="95" width="170" height="86" rx="12" fill="#fff" stroke="#e3e1d9"/><text x="454" y="131" font-size="14" font-weight="600" fill="#19191a">Read the Excel files</text><text x="454" y="153" font-size="12" fill="#8a8b99">Extract from file</text><path d="M614 138 H634" stroke="#a285ef" stroke-width="2.5"/><path d="M630 133 L636 138 L630 143" fill="none" stroke="#a285ef" stroke-width="2.5"/><rect x="640" y="95" width="170" height="86" rx="12" fill="#6a3be5" stroke="#6a3be5"/><text x="654" y="131" font-size="14" font-weight="600" fill="#fff">Score and route</text><text x="654" y="153" font-size="12" fill="#efe9fd">Code · the brain</text><path d="M814 138 H834" stroke="#a285ef" stroke-width="2.5"/><path d="M830 133 L836 138 L830 143" fill="none" stroke="#a285ef" stroke-width="2.5"/><rect x="840" y="95" width="170" height="86" rx="12" fill="#fff" stroke="#e3e1d9"/><text x="854" y="131" font-size="14" font-weight="600" fill="#19191a">SDR lists</text><text x="854" y="153" font-size="12" fill="#8a8b99">Code</text><path d="M1014 138 H1034" stroke="#a285ef" stroke-width="2.5"/><path d="M1030 133 L1036 138 L1030 143" fill="none" stroke="#a285ef" stroke-width="2.5"/><rect x="1040" y="95" width="170" height="86" rx="12" fill="#fff" stroke="#e3e1d9"/><text x="1054" y="131" font-size="14" font-weight="600" fill="#19191a">Make Excel file</text><text x="1054" y="153" font-size="12" fill="#8a8b99">Convert to file</text><path d="M1214 138 H1234" stroke="#a285ef" stroke-width="2.5"/><path d="M1230 133 L1236 138 L1230 143" fill="none" stroke="#a285ef" stroke-width="2.5"/><rect x="1240" y="95" width="170" height="86" rx="12" fill="#fff" stroke="#e3e1d9"/><text x="1254" y="131" font-size="14" font-weight="600" fill="#19191a">Download the lists</text><text x="1254" y="153" font-size="12" fill="#8a8b99">Form ending</text><text x="40" y="222" font-size="12" fill="#8a8b99">Diagram of the workflow in emnify-prioritisation.n8n.json. Import that file into n8n to see the full canvas with the explanatory sticky notes.</text></svg>